name: Appointy CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
          admin/package-lock.json

    - name: Install & Test Backend
      run: |
        cd backend
        npm install
        npm list express mongoose razorpay socket.io nodemailer

    - name: Install & Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Install & Build Admin Panel
      run: |
        cd admin
        npm install
        npm run build
