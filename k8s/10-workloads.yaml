apiVersion: apps/v1
kind: Deployment
metadata:
  name: prayashcare-backend
  namespace: prayashcare
  labels:
    app.kubernetes.io/name: prayashcare-backend
    app.kubernetes.io/part-of: prayashcare
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prayashcare-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prayashcare-backend
        app.kubernetes.io/part-of: prayashcare
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: prayashcare-registry-pull
      containers:
        - name: backend
          image: __IMAGE_PREFIX__/backend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
          envFrom:
            - secretRef:
                name: prayashcare-backend-secrets
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prayashcare-backend
  namespace: prayashcare
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prayashcare-backend
  ports:
    - name: http
      port: 4000
      targetPort: http
