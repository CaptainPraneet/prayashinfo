apiVersion: apps/v1
kind: Deployment
metadata:
  name: prayashcare-frontend
  namespace: prayashcare
  labels:
    app.kubernetes.io/name: prayashcare-frontend
    app.kubernetes.io/part-of: prayashcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: prayashcare-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prayashcare-frontend
        app.kubernetes.io/part-of: prayashcare
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: prayashcare-registry-pull
      containers:
        - name: frontend
          image: __IMAGE_PREFIX__/frontend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prayashcare-frontend
  namespace: prayashcare
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prayashcare-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
